name: Build and Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rollback to (e.g. v1.0.0)'
        required: true
        type: string
      migrations_down:
        description: 'Number of migrations to rollback (0 = none)'
        required: true
        default: '0'
        type: string

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pili-api
  MCP_IMAGE_NAME: ${{ github.repository_owner }}/pili-mcp

# ── Test (auto on push to main) ──────────────────────────────────────────────

jobs:
  build_test:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    name: Build Test Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push Multi-Arch Image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --push \
            .

      - name: Build and Push MCP Image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile.mcp \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.MCP_IMAGE_NAME }}:latest \
            --push \
            .

  deploy_test:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: build_test
    name: Deploy to Home Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trigger deploy webhook
        run: |
          curl -X POST ${{ vars.DEPLOY_WEBHOOK_URL }} \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            --fail --max-time 300

      # A webhook that answered 200 does not mean the new container came up: poll it for 4 minutes.
      # Repository variable TEST_API_BASE_URL = API root of the test server (e.g. https://<host>/api/v1).
      # Only /up is checked: the test database may have no menu.
      - name: Wait for the test server to answer
        env:
          TEST_API: ${{ vars.TEST_API_BASE_URL }}
          SMOKE_ATTEMPTS: '24'
          SMOKE_DELAY: '10'
        run: |
          if [ -z "$TEST_API" ]; then
            echo "::warning::Repository variable TEST_API_BASE_URL is not set: the test deploy is not verified."
            exit 0
          fi
          scripts/smoke.sh up "$TEST_API"

# ── Production release (tag push v*) ────────────────────────────────────────

  build_production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Build Production Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push Production Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg APP_VERSION=${{ github.ref_name }} \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:production \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            --push \
            .

      - name: Build and Push Production MCP Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile.mcp \
            --build-arg APP_VERSION=${{ github.ref_name }} \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.MCP_IMAGE_NAME }}:production \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.MCP_IMAGE_NAME }}:${{ github.ref_name }} \
            --push \
            .

  # Order of a release: the SSH steps below `git pull` tsb-infra on the VPS, whose chart runs
  # `tsb-migrate -cmd=up` as a Helm pre-upgrade hook (templates/tsb-migrate-job.yaml). The new pods
  # only start once the migration succeeded, and a failed one aborts the atomic upgrade. This job
  # therefore no longer runs the migration after the upgrade, and it refuses to deploy if the
  # checkout on the VPS has no hook (tsb-infra must be merged and pulled before the first tag
  # built from this workflow).
  #
  # After each upgrade the site is smoke tested from the runner; a failed smoke test runs
  # `helm rollback` of that release (code only: the schema stays forward, so a release's migrations
  # must keep the previous release working, see the comment of the hook template).
  deploy_production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build_production
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy tokyosushi (Helm, migrations as a pre-upgrade hook)
        id: deploy_tokyosushi
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP: tsb-service
          TAG: ${{ github.ref_name }}
          REPO: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          MCP_REPO: ${{ env.DOCKER_REGISTRY }}/${{ env.MCP_IMAGE_NAME }}
        with:
          host: ${{ vars.OVH_HOST }}
          username: ${{ vars.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          envs: APP,TAG,REPO,MCP_REPO
          script: |
            set -euo pipefail
            export SOPS_AGE_KEY_FILE=/opt/tokyosushi/.config/sops/age/keys.txt
            cd /opt/tokyosushi/tsb-infra
            git pull --ff-only
            if [ ! -f charts/tokyosushi-apps/templates/tsb-migrate-job.yaml ]; then
              echo "::error::tsb-infra on the VPS has no tsb-migrate hook: merge it and pull it first, otherwise this release would start on an unmigrated schema."
              exit 1
            fi
            # tsb-mcp ships from this repo. --reuse-values ignores new chart
            # defaults, so pin it only once the release really deploys it (after a
            # one-off --reset-then-reuse-values upgrade); otherwise the --set would
            # create a half-defined app and fail the atomic upgrade.
            MCP_SET=""
            if sudo kubectl get deployment tsb-mcp -n tokyosushi >/dev/null 2>&1; then MCP_SET="--set apps.tsb-mcp.image.repository=${MCP_REPO} --set apps.tsb-mcp.image.tag=${TAG}"; fi
            sops -d "secrets/${APP}.secret.enc.yaml" | sudo kubectl apply -n tokyosushi -f -
            if ! sudo flock -w 600 /var/lock/tokyosushi-apps-helm.lock env KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install tokyosushi-apps ./charts/tokyosushi-apps \
              --namespace tokyosushi \
              --reuse-values \
              --set "apps.${APP}.image.repository=${REPO}" \
              --set "apps.${APP}.image.tag=${TAG}" \
              ${MCP_SET} \
              --atomic --timeout 5m; then
              # The pre-upgrade hook Job is kept when it fails: show why.
              echo "::group::tsb-migrate hook logs"
              sudo kubectl logs -n tokyosushi job/tsb-migrate --tail=100 || true
              echo "::endgroup::"
              exit 1
            fi

      - name: Smoke test tokyosushi
        id: smoke_tokyosushi
        env:
          API: ${{ vars.TSB_API_BASE_URL }}
        run: scripts/smoke.sh --skip-unset api "$API"

      - name: Roll back tokyosushi after a failed smoke test
        id: rollback_tokyosushi
        if: failure() && steps.smoke_tokyosushi.outcome == 'failure'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.OVH_HOST }}
          username: ${{ vars.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            sudo flock -w 600 /var/lock/tokyosushi-apps-helm.lock env KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
              helm rollback tokyosushi-apps --namespace tokyosushi --wait --timeout 5m

      # Yangguofu Malatang Liège (release ygf-apps, namespace ygf) runs the same backend image on
      # its own DB: keep it on the same version and schema. Skipped until that release exists.
      # Runs only when tokyosushi deployed and passed its smoke test.
      - name: Deploy ygf (Helm, migrations as a pre-upgrade hook)
        id: deploy_ygf
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP: tsb-service
          TAG: ${{ github.ref_name }}
          REPO: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
        with:
          host: ${{ vars.OVH_HOST }}
          username: ${{ vars.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          envs: APP,TAG,REPO
          script: |
            set -euo pipefail
            export SOPS_AGE_KEY_FILE=/opt/tokyosushi/.config/sops/age/keys.txt
            cd /opt/tokyosushi/tsb-infra
            if sudo env KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm status ygf-apps -n ygf >/dev/null 2>&1; then
              sops -d "secrets/ygf-${APP}.secret.enc.yaml" | sudo kubectl apply -n ygf -f -
              if ! sudo flock -w 600 /var/lock/ygf-apps-helm.lock env KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade ygf-apps ./charts/tokyosushi-apps \
                --namespace ygf \
                -f ./charts/tokyosushi-apps/values.ygf.yaml \
                --reuse-values \
                --set "apps.${APP}.image.repository=${REPO}" \
                --set "apps.${APP}.image.tag=${TAG}" \
                --atomic --timeout 5m; then
                echo "::group::tsb-migrate hook logs"
                sudo kubectl logs -n ygf job/tsb-migrate --tail=100 || true
                echo "::endgroup::"
                exit 1
              fi
            fi

      # Repository variable YGF_API_BASE_URL = API root of the ygf site (https://ygfliege.be/api/v1).
      - name: Smoke test ygf
        id: smoke_ygf
        env:
          API: ${{ vars.YGF_API_BASE_URL }}
        run: scripts/smoke.sh --skip-unset api "$API"

      - name: Roll back ygf after a failed smoke test
        id: rollback_ygf
        if: failure() && steps.smoke_ygf.outcome == 'failure'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.OVH_HOST }}
          username: ${{ vars.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            sudo flock -w 600 /var/lock/ygf-apps-helm.lock env KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
              helm rollback ygf-apps --namespace ygf --wait --timeout 5m

      - name: Alert on a failed deploy
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: >-
            pili-api ${{ github.ref_name }}: production deploy failed.
            tokyosushi smoke ${{ steps.smoke_tokyosushi.outcome }}, rollback ${{ steps.rollback_tokyosushi.outcome }};
            ygf smoke ${{ steps.smoke_ygf.outcome }}, rollback ${{ steps.rollback_ygf.outcome }}.
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then exit 0; fi
          curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" \
            || echo "::warning::Telegram alert failed"

# ── Rollback (manual trigger) ────────────────────────────────────────────────

  # Manual only (workflow_dispatch). Order matters: the migrations are rolled back FIRST, with the
  # image that is running now (it is the one that ships the Down sections of the migrations to
  # undo), then the code goes back to the requested version. The chart's pre-upgrade hook then runs
  # `up` with the OLD image, which is a no-op because the schema is already at or below its own.
  # migrations_down = 0 keeps the schema forward (code-only rollback), which only works when the
  # migrations of the rolled back release were additive (expand/contract). The tokyosushi and ygf
  # databases are rolled back by the same number of migrations.
  rollback:
    if: github.event_name == 'workflow_dispatch'
    name: Rollback Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Rollback via SSH (Helm)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP: tsb-service
          TAG: ${{ inputs.version }}
          REPO: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          MCP_REPO: ${{ env.DOCKER_REGISTRY }}/${{ env.MCP_IMAGE_NAME }}
          MIGRATIONS_DOWN: ${{ inputs.migrations_down }}
        with:
          host: ${{ vars.OVH_HOST }}
          username: ${{ vars.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          envs: APP,TAG,REPO,MCP_REPO,MIGRATIONS_DOWN
          script: |
            set -euo pipefail
            case "${MIGRATIONS_DOWN:-0}" in
              '' | *[!0-9]*) echo "::error::migrations_down must be a whole number"; exit 1 ;;
            esac
            cd /opt/tokyosushi/tsb-infra
            # Same tsb-mcp gate as the deploy job.
            MCP_SET=""
            if sudo kubectl get deployment tsb-mcp -n tokyosushi >/dev/null 2>&1; then MCP_SET="--set apps.tsb-mcp.image.repository=${MCP_REPO} --set apps.tsb-mcp.image.tag=${TAG}"; fi
            YGF=0
            if sudo env KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm status ygf-apps -n ygf >/dev/null 2>&1; then YGF=1; fi

            # 1. Roll back DB migrations first, using the running (current) image.
            # `bash -c` does not inherit errexit: set it, so one failed down stops the loop and the job.
            sudo flock -w 600 /var/lock/tokyosushi-apps-helm.lock bash -c '
              set -euo pipefail
              for i in $(seq 1 "$1"); do
                kubectl exec -n tokyosushi deployment/tsb-service -- /app/tsb-migrate -cmd=down
              done' _ "${MIGRATIONS_DOWN:-0}"
            if [ "$YGF" = 1 ]; then
              sudo flock -w 600 /var/lock/ygf-apps-helm.lock bash -c '
                set -euo pipefail
                for i in $(seq 1 "$1"); do
                  kubectl exec -n ygf deployment/tsb-service -- /app/tsb-migrate -cmd=down
                done' _ "${MIGRATIONS_DOWN:-0}"
            fi

            # 2. Then swap the code.
            sudo flock -w 600 /var/lock/tokyosushi-apps-helm.lock env KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install tokyosushi-apps ./charts/tokyosushi-apps \
              --namespace tokyosushi \
              --reuse-values \
              --set "apps.${APP}.image.repository=${REPO}" \
              --set "apps.${APP}.image.tag=${TAG}" \
              ${MCP_SET} \
              --atomic --timeout 5m
            if [ "$YGF" = 1 ]; then
              sudo flock -w 600 /var/lock/ygf-apps-helm.lock env KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade ygf-apps ./charts/tokyosushi-apps \
                --namespace ygf \
                -f ./charts/tokyosushi-apps/values.ygf.yaml \
                --reuse-values \
                --set "apps.${APP}.image.repository=${REPO}" \
                --set "apps.${APP}.image.tag=${TAG}" \
                --atomic --timeout 5m
            fi

# ── Production smoke test (tag push v*) ─────────────────────────────────────

  smoke_production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: deploy_production
    name: Smoke test production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      API: ${{ vars.TSB_API_BASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Passes when the API answers /up and lists the menu categories from the database, retried for 5 minutes.
      - name: Check the live site
        id: smoke
        run: |
          set -uo pipefail
          if [ -z "${API:-}" ]; then echo "::error::Production URL variable missing."; exit 1; fi
          live() {
            curl -fsS --max-time 20 -o /dev/null "$API/up" &&
              curl -fsS --max-time 20 -X POST "$API/graphql" \
                -H 'content-type: application/json' \
                -d '{"query":"{ productCategories { id } }"}' |
              jq -e '.data.productCategories | length > 0' >/dev/null
          }
          for i in $(seq 1 10); do
            if live; then echo "Smoke test passed (attempt $i)."; exit 0; fi
            echo "Attempt $i failed, retrying in 30 s."
            sleep 30
          done
          exit 1

      # A release tagged by "Nightly dependency release" only carries
      # Dependabot updates (no migration), so the previous version is a safe
      # target. A release tagged by hand is never rolled back automatically.
      - name: Roll back an automated release
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          set -euo pipefail
          repo="${GH_REPO#*/}"
          notify() {
            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then return 0; fi
            curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$1" \
              --data-urlencode "disable_web_page_preview=true" \
              --data-urlencode "disable_notification=true" \
              || echo "::warning::Telegram alert failed: $1"
          }
          subject=$(git tag -l --format='%(contents:subject)' "$TAG")
          prev=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | awk -v t="$TAG" 'found { print; exit } $0 == t { found = 1 }')
          if [[ "$subject" == "Automated dependency release"* ]] && [ -n "$prev" ]; then
            gh workflow run action.yml --ref main -f version="$prev" -f migrations_down=0
            notify "↩️ $repo $TAG failed its production smoke test: rolling back to $prev. $GITHUB_SERVER_URL/$GH_REPO/actions"
          else
            notify "🔥 $repo $TAG failed its production smoke test. Not an automated release: check it, and roll back by hand (Run workflow, version $prev) if needed. $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          fi
