name: Build and Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rollback to (e.g. v1.0.0)'
        required: true
        type: string
      migrations_down:
        description: 'Number of migrations to rollback (0 = none)'
        required: true
        default: '0'
        type: string

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pili-api
  MCP_IMAGE_NAME: ${{ github.repository_owner }}/pili-mcp

# ── Test (auto on push to main) ──────────────────────────────────────────────

jobs:
  build_test:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    name: Build Test Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push Multi-Arch Image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --push \
            .

      - name: Build and Push MCP Image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile.mcp \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.MCP_IMAGE_NAME }}:latest \
            --push \
            .

  deploy_test:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: build_test
    name: Deploy to Home Server
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy webhook
        run: |
          curl -X POST ${{ vars.DEPLOY_WEBHOOK_URL }} \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            --fail --max-time 300

# ── Production release (tag push v*) ────────────────────────────────────────

  build_production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Build Production Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push Production Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg APP_VERSION=${{ github.ref_name }} \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:production \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            --push \
            .

      - name: Build and Push Production MCP Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile.mcp \
            --build-arg APP_VERSION=${{ github.ref_name }} \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.MCP_IMAGE_NAME }}:production \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.MCP_IMAGE_NAME }}:${{ github.ref_name }} \
            --push \
            .

  deploy_production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build_production
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy and migrate via SSH (Helm)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP: tsb-service
          TAG: ${{ github.ref_name }}
          REPO: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          MCP_REPO: ${{ env.DOCKER_REGISTRY }}/${{ env.MCP_IMAGE_NAME }}
        with:
          host: ${{ vars.OVH_HOST }}
          username: ${{ vars.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          envs: APP,TAG,REPO,MCP_REPO
          script: |
            set -euo pipefail
            export SOPS_AGE_KEY_FILE=/opt/tokyosushi/.config/sops/age/keys.txt
            cd /opt/tokyosushi/tsb-infra
            git pull --ff-only
            # The migrations run inside `helm upgrade`, as the chart's pre-upgrade hook (Job
            # tsb-migrate, image of this release), before any pod changes: a failed migration
            # fails the upgrade while the old pods keep serving. Refuse to deploy without it.
            test -f charts/tokyosushi-apps/templates/tsb-migrate-job.yaml || { echo "tsb-infra has no tsb-migrate hook" >&2; exit 1; }
            # tsb-mcp ships from this repo. --reuse-values ignores new chart
            # defaults, so pin it only once the release really deploys it (after a
            # one-off --reset-then-reuse-values upgrade); otherwise the --set would
            # create a half-defined app and fail the atomic upgrade.
            MCP_SET=""
            if sudo kubectl get deployment tsb-mcp -n tokyosushi >/dev/null 2>&1; then MCP_SET="--set apps.tsb-mcp.image.repository=${MCP_REPO} --set apps.tsb-mcp.image.tag=${TAG}"; fi
            # A failed hook Job is kept: print its logs before failing the deploy.
            migrate_logs() {
              sudo kubectl logs -n "$1" job/tsb-migrate --tail=50 >&2 || true
              return 1
            }
            sops -d "secrets/${APP}.secret.enc.yaml" | sudo kubectl apply -n tokyosushi -f -
            sudo flock -w 600 /var/lock/tokyosushi-apps-helm.lock env KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install tokyosushi-apps ./charts/tokyosushi-apps \
              --namespace tokyosushi \
              --reuse-values \
              --set "apps.${APP}.image.repository=${REPO}" \
              --set "apps.${APP}.image.tag=${TAG}" \
              ${MCP_SET} \
              --atomic --timeout 5m || migrate_logs tokyosushi
            # Yangguofu Malatang Liège (release ygf-apps, namespace ygf) runs the
            # same backend image on its own DB: keep it on the same version and
            # schema (the same hook migrates it). Skipped until that release exists.
            if sudo env KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm status ygf-apps -n ygf >/dev/null 2>&1; then
              sops -d "secrets/ygf-${APP}.secret.enc.yaml" | sudo kubectl apply -n ygf -f -
              sudo flock -w 600 /var/lock/ygf-apps-helm.lock env KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade ygf-apps ./charts/tokyosushi-apps \
                --namespace ygf \
                -f ./charts/tokyosushi-apps/values.ygf.yaml \
                --reuse-values \
                --set "apps.${APP}.image.repository=${REPO}" \
                --set "apps.${APP}.image.tag=${TAG}" \
                --atomic --timeout 5m || migrate_logs ygf
            fi

# ── Rollback (manual trigger) ────────────────────────────────────────────────

  rollback:
    if: github.event_name == 'workflow_dispatch'
    name: Rollback Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Rollback via SSH (Helm)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP: tsb-service
          TAG: ${{ inputs.version }}
          REPO: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          MCP_REPO: ${{ env.DOCKER_REGISTRY }}/${{ env.MCP_IMAGE_NAME }}
          MIGRATIONS_DOWN: ${{ inputs.migrations_down }}
        with:
          host: ${{ vars.OVH_HOST }}
          username: ${{ vars.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          envs: APP,TAG,REPO,MCP_REPO,MIGRATIONS_DOWN
          script: |
            set -euo pipefail
            cd /opt/tokyosushi/tsb-infra
            # Same tsb-mcp gate as the deploy job.
            MCP_SET=""
            if sudo kubectl get deployment tsb-mcp -n tokyosushi >/dev/null 2>&1; then MCP_SET="--set apps.tsb-mcp.image.repository=${MCP_REPO} --set apps.tsb-mcp.image.tag=${TAG}"; fi
            # Roll back DB migrations first (using current container), before swapping image.
            # The upgrade below then runs the older image's tsb-migrate hook: `up` with nothing
            # left to apply, a no-op even when MIGRATIONS_DOWN left newer versions in place.
            for i in $(seq 1 "${MIGRATIONS_DOWN:-0}"); do
              sudo kubectl exec -n tokyosushi deployment/tsb-service -- /app/tsb-migrate -cmd=down
            done
            sudo flock -w 600 /var/lock/tokyosushi-apps-helm.lock env KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install tokyosushi-apps ./charts/tokyosushi-apps \
              --namespace tokyosushi \
              --reuse-values \
              --set "apps.${APP}.image.repository=${REPO}" \
              --set "apps.${APP}.image.tag=${TAG}" \
              ${MCP_SET} \
              --atomic --timeout 5m
