name: Tests

# Pull requests and pushes to other branches run this directly. Pushes to main
# and release tags run it through the "tests" job of action.yml (workflow_call),
# which every image build waits for, so no untested commit reaches the test
# server or production.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main, master]
  workflow_call:

# A called workflow cannot hold more than its caller grants.
permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      docker:
        image: docker:dind
        options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Dockerfile pins the Go patch release (bumped by Dependabot), so CI
      # tests with the same toolchain the production image is built with.
      - name: Read Go version from Dockerfile
        id: go
        run: echo "version=$(sed -nE 's/^FROM .*golang:([0-9.]+)-alpine.*/\1/p' Dockerfile | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests with coverage gate
        # Fails below 98 % statement coverage (generated code, test support and cmd/ excluded).
        run: |
          go test -race -timeout 30m ./cmd/...
          scripts/coverage-check.sh 98 -timeout 30m
        env:
          JWT_SECRET: test-jwt-secret-for-ci
          MOLLIE_API_TOKEN: test_dummy_token

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Dockerfile pins the Go patch release (bumped by Dependabot), so CI
      # tests with the same toolchain the production image is built with.
      - name: Read Go version from Dockerfile
        id: go
        run: echo "version=$(sed -nE 's/^FROM .*golang:([0-9.]+)-alpine.*/\1/p' Dockerfile | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned: "latest" would change the rules under a green build.
          # Bump it by hand together with the Go version in the Dockerfile.
          version: v2.15.0
          args: --timeout=5m

  vulncheck:
    name: Vulnerability scan
    # Same scan as the daily "Security scan" workflow, for pull requests and
    # branches. Not on main or release tags: a vulnerability published today
    # must not block an unrelated release, the daily scan alerts on it instead.
    if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Go version from Dockerfile
        id: go
        run: echo "version=$(sed -nE 's/^FROM .*golang:([0-9.]+)-alpine.*/\1/p' Dockerfile | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Dockerfile pins the Go patch release (bumped by Dependabot), so CI
      # tests with the same toolchain the production image is built with.
      - name: Read Go version from Dockerfile
        id: go
        run: echo "version=$(sed -nE 's/^FROM .*golang:([0-9.]+)-alpine.*/\1/p' Dockerfile | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: true

      - name: Build
        run: go build -v -o tsb-service ./cmd/app

      # The release and nightly workflows refuse an untested commit through
      # this script: keep its verdicts honest.
      - name: Self-test the green-commit gate
        run: bash .github/scripts/main-green.test.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsb-service-binary
          path: tsb-service
          # Nothing downloads it; a short life keeps the account's shared
          # artifact quota free (65 copies at 90 days filled it in Oct 2026).
          retention-days: 3
