enum CouponStatus {
    ACTIVE
    INACTIVE
    SCHEDULED
    EXPIRED
    EXHAUSTED
}

type Coupon {
    id: ID!
    code: String!
    discountType: String!
    discountValue: String!
    minOrderAmount: String
    maxUses: Int
    maxUsesPerUser: Int
    usedCount: Int!
    isActive: Boolean!
    status: CouponStatus!
    validFrom: DateTime
    validUntil: DateTime
    createdAt: DateTime!
}

type CouponValidation {
    valid: Boolean!
    discountAmount: String!
    "English message, for logs and old clients: show errorCode translated instead."
    errorMessage: String
    "Stable code when valid is false: COUPON_INVALID, COUPON_MIN_ORDER_NOT_MET or COUPON_RATE_LIMITED."
    errorCode: String
}

input CreateCouponInput {
    "Optional. When omitted or blank, the server generates a unique code."
    code: String
    discountType: String!
    discountValue: String!
    minOrderAmount: String
    maxUses: Int
    maxUsesPerUser: Int
    isActive: Boolean!
    validFrom: DateTime
    validUntil: DateTime
}

input UpdateCouponInput {
    code: String
    discountType: String
    discountValue: String
    minOrderAmount: String
    maxUses: Int
    maxUsesPerUser: Int
    isActive: Boolean
    validFrom: DateTime
    validUntil: DateTime
}

extend type Query {
    validateCoupon(code: String!, orderAmount: String!): CouponValidation! @auth
    coupons: [Coupon!]! @admin
    coupon(id: ID!): Coupon! @admin
}

extend type Mutation {
    createCoupon(input: CreateCouponInput!): Coupon! @staff
    updateCoupon(id: ID!, input: UpdateCouponInput!): Coupon! @admin
}

extend type Subscription {
    couponUpdated: Coupon! @admin
}
