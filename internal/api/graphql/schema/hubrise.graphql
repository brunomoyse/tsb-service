# HubRise integration (dashboard): the connection to a HubRise location, its settings, the outbox
# of what is on its way to HubRise, and the catalog import. Every operation is admin only and
# additive: a shop without HubRise answers `hubriseStatus.available = false` and nothing else.
#
# The access token never appears in this API.

type HubriseFeatures {
    # Push the orders (web and app) to HubRise.
    pushOrders: Boolean!
    # Apply the status changes made in HubRise to the orders.
    syncStatus: Boolean!
    # Sold-out products and options follow the HubRise inventory, and the other way round.
    syncInventory: Boolean!
    # HubRise is the source of truth of the menu: its price, category, VAT, code and options are locked.
    syncCatalog: Boolean!
}

type HubriseBacklog {
    pending: Int!
    # Rows HubRise refused for good; they wait for a manual retry.
    parked: Int!
}

type HubriseStatus {
    # False when HubRise is not configured on this server (no client id, secret and token key);
    # every other field is then empty.
    available: Boolean!
    # A HubRise location is authorized (an access token is stored).
    connected: Boolean!
    # The integration is switched on. A connected but disabled integration is paused: nothing leaves
    # and nothing is imported.
    enabled: Boolean!

    accountId: String
    accountName: String
    locationId: String
    locationName: String
    catalogId: String
    catalogName: String
    customerListId: String
    customerListName: String

    features: HubriseFeatures!
    # Keep the HubRise customer list in step with the shop's accounts.
    syncCustomers: Boolean!
    # Import the catalog when HubRise says it changed, instead of only showing "update available".
    catalogAutoImport: Boolean!
    # HubRise has a catalog the shop has not imported yet.
    catalogUpdateAvailable: Boolean!
    # A scheduled import stopped at the mass-retire threshold and waits for a human to confirm.
    catalogPendingReview: Boolean!
    # Cancelling an order in HubRise refunds a paid online order automatically. Off by default.
    autoRefundOnCancel: Boolean!

    # fr, en, nl or zh: the language the HubRise catalog is written in.
    catalogLanguage: String!
    variantRef: String
    channelName: String
    deliveryChargeRef: String
    paymentFeeChargeRef: String
    importImages: Boolean!

    lastCatalogSyncAt: DateTime
    lastEventAt: DateTime
    # Since when HubRise refuses the token (revoked, blocked, unpaid or missing scope): the
    # integration is paused until the connection is authorized again.
    authErrorAt: DateTime
    lastError: String
    # The connection now points at another HubRise location or catalog than the existing links were
    # made for: forget the links before enabling the integration.
    relinkRequired: Boolean!

    backlog: HubriseBacklog!
    # Visible products an order would send without a SKU ref.
    unlinkedProducts: Int!
    # Orders flagged for staff (HubRise refused or never accepted them, a paid order was cancelled
    # there...). The flag is on Order.hubrise.
    attention: Int!
}

enum HubriseOutboxState {
    PENDING
    SENDING
    SENT
    PARKED
    SKIPPED
}

enum HubriseOutboxKind {
    ORDER_CREATE
    ORDER_STATUS
    INVENTORY
    CUSTOMER
    CUSTOMER_ANONYMISE
}

# One request on its way to HubRise. The content is deliberately not exposed: it holds customer data.
type HubriseOutboxItem {
    # A String: the global ID scalar is bound to UUID.
    id: String!
    kind: HubriseOutboxKind!
    orderId: ID
    state: HubriseOutboxState!
    attempts: Int!
    lastError: String
    nextAttemptAt: DateTime!
    createdAt: DateTime!
    sentAt: DateTime
    parkedAt: DateTime
}

input HubriseSettingsInput {
    enabled: Boolean
    pushOrders: Boolean
    syncStatus: Boolean
    syncInventory: Boolean
    # Needs a dry run of the current catalog from the last 24 hours (HUBRISE_PREVIEW_REQUIRED).
    syncCatalog: Boolean
    syncCustomers: Boolean
    catalogAutoImport: Boolean
    autoRefundOnCancel: Boolean
    importImages: Boolean
    catalogLanguage: String
    # The text options: an empty string clears the option.
    variantRef: String
    channelName: String
    deliveryChargeRef: String
    paymentFeeChargeRef: String
}

# How far an import goes.
enum HubriseSyncMode {
    # Computes what a full import would do and writes nothing (it counts as the preview catalog sync needs).
    DRY_RUN
    # Records the links between HubRise entries and existing products, so orders carry SKU and option
    # refs, without touching any product data.
    LINK_ONLY
    # Adopts, creates, updates and retires.
    FULL
}

enum HubriseCatalogAction {
    CREATE
    UPDATE
    LINK
    RETIRE
    REVIVE
}

enum HubriseCatalogEntity {
    CATEGORY
    PRODUCT
    CHOICE_GROUP
    CHOICE
}

type HubriseCatalogChange {
    entity: HubriseCatalogEntity!
    action: HubriseCatalogAction!
    # The HubRise key of the entry (ref, SKU ref, "sku|list", "sku|list|option").
    key: String!
    name: String!
    # What changes: price, category, vat_category, code, visibility, availability, names, limits...
    fields: [String!]!
}

# Something the import noticed and did not silently absorb, or a match it refused to guess.
type HubriseCatalogIssue {
    code: String!
    key: String
    message: String!
}

type HubriseCatalogDiff {
    catalogHash: String!
    changes: [HubriseCatalogChange!]!
    warnings: [HubriseCatalogIssue!]!
    # Ambiguous matches: neither created nor linked.
    conflicts: [HubriseCatalogIssue!]!
    unchanged: Int!
    # The products this import would retire, out of the linked ones.
    retiringProducts: Int!
    linkedProducts: Int!
    # Retiring that many needs `confirmRetire`.
    retireNeedsConfirm: Boolean!
}

type HubriseSyncResult {
    mode: HubriseSyncMode!
    # False for a dry run and for an import waiting for confirmation.
    applied: Boolean!
    # A scheduled import stopped at the mass-retire threshold.
    pendingReview: Boolean!
    diff: HubriseCatalogDiff!
    # The batches (a category with its products) that were rolled back.
    failedBatches: [String!]!
}

# What staff see about the HubRise side of an order.
type HubriseOrderInfo {
    hubriseOrderId: String
    # pending, sent, parked or skipped.
    pushState: String!
    pushedAt: DateTime
    # The status HubRise last reported.
    remoteStatus: String
    # The total HubRise computed, two decimals.
    remoteTotal: String
    # Why staff must look at the order (UNLINKED_ITEM, TOTAL_MISMATCH, NOT_ACCEPTED, REMOTE_CANCELLED_PAID...).
    needsAttention: String
}

extend type Query {
    hubriseStatus: HubriseStatus! @admin
    hubriseOutbox(state: HubriseOutboxState, first: Int = 50): [HubriseOutboxItem!]! @admin
}

extend type Mutation {
    # The HubRise URL to send the browser to. HubRise sends it back to /api/v1/hubrise/oauth/callback.
    startHubriseConnection: String! @admin
    # Revokes the token, deletes the callback and switches the integration off. The links stay unless forgetLinks.
    disconnectHubrise(forgetLinks: Boolean = false): HubriseStatus! @admin
    updateHubriseSettings(input: HubriseSettingsInput!): HubriseStatus! @admin
    previewHubriseCatalogSync(mode: HubriseSyncMode!): HubriseCatalogDiff! @admin
    syncHubriseCatalog(mode: HubriseSyncMode!, confirmRetire: Boolean = false): HubriseSyncResult! @admin
    # Clears every catalog link. The products stay, as ordinary products. Returns how many links went.
    forgetHubriseLinks: Int! @admin
    # Reads the HubRise inventory now. Returns how many products and options changed or got a stock figure.
    syncHubriseInventory: Int! @admin
    # Links a product to a HubRise SKU by hand; no skuRef removes the link.
    linkHubriseProduct(productId: ID!, skuRef: String): Boolean! @admin
    # Retries the parked rows: those of the chain of row `id`, or all of them. Returns how many.
    retryHubriseOutbox(id: String): Int! @admin
}
