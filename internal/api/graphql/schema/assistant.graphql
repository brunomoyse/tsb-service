# Telegram assistant (tsb-agent): its Telegram bot, the accounts linked to it
# and the one-time links that add an account. The assistant runs as a
# separate service; these fields proxy its admin API.

enum AssistantConnectionState {
    # The bot works and at least one account is linked.
    READY
    # The bot works but no account is linked yet.
    NO_ACCOUNTS
    # Telegram refused the bot (its token was revoked or the bot deleted).
    TOKEN_REJECTED
    # Another process polls Telegram with the same bot token.
    CONFLICT
    # The assistant service did not answer.
    UNAVAILABLE
}

type AssistantAccount {
    # The Telegram user id. A String, not an ID: the global ID scalar is bound
    # to UUID, and Telegram ids are numbers.
    id: String!
    name: String!
    # The Telegram @username, when the account has one.
    username: String
    linkedAt: DateTime!
}

type AssistantConnection {
    # False when no assistant is configured on this server.
    enabled: Boolean!
    state: AssistantConnectionState!
    # The bot's @username (without the @), once known.
    botUsername: String
    accounts: [AssistantAccount!]!
    # How many accounts may be linked at once.
    maxAccounts: Int!
    # Since when the bot has a problem (TOKEN_REJECTED, CONFLICT).
    problemSince: DateTime
}

enum AssistantLinkStatus {
    WAIT
    LINKED
    EXPIRED
    # The account limit was reached before the link was used.
    REFUSED_FULL
}

type AssistantLink {
    id: String!
    status: AssistantLinkStatus!
    # A t.me link to show as a QR code or a button; opening it and tapping
    # Start links the Telegram account.
    url: String!
    expiresAt: DateTime!
    # The account that was linked, once status is LINKED.
    account: AssistantAccount
}

extend type Query {
    assistantConnection: AssistantConnection! @admin
    assistantLink(id: String!): AssistantLink! @admin
}

extend type Mutation {
    startAssistantLink: AssistantLink! @admin
    removeAssistantAccount(id: String!): AssistantConnection! @admin
}

extend type Subscription {
    assistantConnectionUpdated: AssistantConnection! @admin
}
