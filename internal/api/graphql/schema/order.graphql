type Order {
    id: ID!
    createdAt: DateTime!
    updatedAt: DateTime!
    status: OrderStatusEnum!
    type: OrderTypeEnum!
    isOnlinePayment: Boolean!
    discountAmount: String!
    deliveryFee: String
    transactionFee: String
    totalPrice: String!
    preferredReadyTime: DateTime
    estimatedReadyTime: DateTime
    addressExtra: String
    orderNote: String
    orderExtra: JSON
    couponCode: String
    cancellationReason: OrderCancellationReason
    cashPaymentAmount: String

    address: Address
    customer: User
    payment: Payment
    items: [OrderItem!]!

    isManualAddress: Boolean!

    statusHistory: [OrderStatusHistory!]! @admin

    # Computed helper fields for display
    displayCustomerName: String!
    displayAddress: String!
}

type OrderStatusHistory {
    id: ID!
    status: OrderStatusEnum!
    changedAt: DateTime!
}

type OrderItem {
    product: Product!
    productID: ID!
    unitPrice: String!
    quantity: Int!
    totalPrice: String!
    vatRateApplied: String!
    choiceId: ID
    choice: ProductChoice
    selections: [OrderItemSelection!]!
}

type OrderItemSelection {
    groupId: ID!
    choiceId: ID!
    quantity: Int!
    group: ProductChoiceGroup!
    choice: ProductChoice!
}

enum OrderStatusEnum {
    PENDING
    CONFIRMED
    PREPARING
    AWAITING_PICK_UP
    PICKED_UP
    OUT_FOR_DELIVERY
    DELIVERED
    CANCELLED
    FAILED
}

enum OrderTypeEnum {
    DELIVERY
    PICKUP
}

enum OrderCancellationReason {
    OUT_OF_STOCK
    KITCHEN_CLOSED
    DELIVERY_AREA
    "The customer placed the same order twice (or re-ordered with a change); the other one stands."
    DUPLICATE
    OTHER
}

input OrderExtraInput {
    name: String!
    options: [String!]
}

input CreateOrderInput {
    orderType: OrderTypeEnum!
    isOnlinePayment: Boolean!
    addressPlaceId: String
    addressExtra: String
    orderNote: String
    orderExtra: [OrderExtraInput!]
    preferredReadyTime: DateTime
    items: [CreateOrderItemInput!]!
    couponCode: String
    # Cash payment amount the customer wants to pay with (for change calculation)
    cashPaymentAmount: String
    # Custom redirect URL for Mollie payment (native apps use custom URL scheme)
    paymentRedirectUrl: String
}

input CreateOrderItemInput {
    productId: ID!
    quantity: Int!
    choiceId: ID
    selections: [CreateOrderItemSelectionInput!]
}

input CreateOrderItemSelectionInput {
    groupId: ID!
    choiceId: ID!
    quantity: Int!
}

input UpdateOrderInput {
    status: OrderStatusEnum
    estimatedReadyTime: DateTime
    cancellationReason: OrderCancellationReason
}

input OrderHistoryInput {
    startDate: DateTime
    endDate: DateTime
    status: OrderStatusEnum
    orderType: OrderTypeEnum
    search: String
    first: Int = 20
    page: Int = 1
}

type OrderHistorySummary {
    totalOrders: Int!
    totalRevenue: String!
    averageOrder: String!
}

type OrderHistoryResponse {
    orders: [Order!]!
    summary: OrderHistorySummary!
}

"""
Everything createOrder would validate and price, without saving anything: the basket as it would be
charged right now. Problems are reported instead of failing on the first one.
"""
input QuoteOrderInput {
    orderType: OrderTypeEnum!
    isOnlinePayment: Boolean!
    addressPlaceId: String
    preferredReadyTime: DateTime
    items: [QuoteOrderItemInput!]!
    "Only evaluated for an authenticated caller."
    couponCode: String
}

input QuoteOrderItemInput {
    productId: ID!
    quantity: Int!
    choiceId: ID
    selections: [CreateOrderItemSelectionInput!]
    "The line total (decimal string) the client currently displays. When it differs from today's price the line gets a PRICE_CHANGED issue carrying currentPrice."
    expectedLineTotal: String
}

"""
The price of a basket right now. Money fields are decimal strings ("12.50"); `total` is what the
customer would be charged (equal to the createOrder total_price), a multiple of 0,10 EUR and never
negative. A basket with any `issues` or line issues cannot be ordered as is.
"""
type OrderQuote {
    "In the order of the input items."
    lines: [OrderQuoteLine!]!
    "Σ lineTotal of the lines that could be priced."
    subtotal: String!
    deliveryFee: String!
    pickupDiscount: String!
    couponDiscount: String!
    "The online payment surcharge (0 for cash)."
    onlineFee: String!
    total: String!
    "null when no coupon code was sent."
    coupon: OrderQuoteCoupon
    "Order-level problems; every code is in apperr (codes.go)."
    issues: [OrderIssue!]!
}

type OrderQuoteLine {
    productId: ID!
    quantity: Int!
    "The selections as priced: the legacy choiceId is folded in, choices that exist carry today's priceModifier."
    selections: [OrderQuoteSelection!]!
    "Today's price of the product itself (without choices); null when the product does not exist."
    productPrice: String
    "lineTotal / quantity rounded to cents (what createOrder stores as unit_price)."
    unitPrice: String!
    "base × quantity + Σ choice surcharges (see PriceLine); 0 when the line cannot be priced (missing or sold-out product, bad quantity or selections)."
    lineTotal: String!
    issues: [OrderLineIssue!]!
}

type OrderQuoteSelection {
    groupId: ID!
    choiceId: ID!
    quantity: Int!
    priceModifier: String!
}

"""
A problem with one line. code: PRODUCT_NOT_FOUND, PRODUCT_UNAVAILABLE, INVALID_QUANTITY,
SELECTION_INVALID, INVALID_PRICE, LUNCH_SLOT_REQUIRED or PRICE_CHANGED.
"""
type OrderLineIssue {
    code: String!
    "Today's price of the product, whenever it exists (PRICE_CHANGED, PRODUCT_UNAVAILABLE...)."
    currentPrice: String
}

"""
An order-level problem. code: ORDERING_UNAVAILABLE, ORDERING_CLOSED_TODAY, SLOT_*, ORDER_EMPTY,
ORDER_TOO_MANY_ITEMS, DELIVERY_MINIMUM_NOT_MET, ADDRESS_REQUIRED, ADDRESS_UNRESOLVABLE,
DELIVERY_OUT_OF_ZONE, DELIVERY_AREA_EXCLUDED, DELIVERY_UNAVAILABLE or a COUPON_* code.
"""
type OrderIssue {
    code: String!
    "Euros, for DELIVERY_MINIMUM_NOT_MET and COUPON_MIN_ORDER_NOT_MET."
    minimum: String
}

type OrderQuoteCoupon {
    code: String!
    valid: Boolean!
    "Why it is not valid: a COUPON_* code, or UNAUTHENTICATED when the caller is not signed in (the coupon was not evaluated)."
    errorCode: String
}

extend type Query {
    "Public: the basket can be priced before signing in. A coupon is only evaluated when authenticated."
    quoteOrder(input: QuoteOrderInput!): OrderQuote!
    orders: [Order!]! @staff
    order(id: ID!): Order! @staff
    customerOrders(userId: ID!, first: Int = 20, page: Int = 1): [Order!]! @admin
    orderHistory(input: OrderHistoryInput): OrderHistoryResponse! @admin
    myOrders (first: Int = 5, page: Int = 1): [Order!]! @auth
    myOrder(id: ID!): Order! @auth
    "The signed-in customer's products from their delivered or collected orders, most often ordered first. Only products on sale now; `first` is capped at 24."
    myOrderedProducts(first: Int = 12): [ProductOrderCount!]! @auth
    "The products in the most delivered or collected orders over the last 90 days, at most two per category. Only products on sale now; `first` is capped at 24."
    popularProducts(first: Int = 8): [ProductOrderCount!]!
}

"How often a product was ordered, for the menu's \"your favourites\" and \"most ordered\" rows."
type ProductOrderCount {
    productId: ID!
    "In how many separate orders the product was, however many units each one held."
    orderCount: Int!
}

extend type Mutation {
    createOrder(input: CreateOrderInput!): Order! @auth
    updateOrder(id: ID!, input: UpdateOrderInput!): Order! @staff

    # Push notification token management
    registerDeviceToken(deviceToken: String!, platform: String!): Boolean! @auth
    unregisterDeviceToken(deviceToken: String!): Boolean! @auth

    # iOS Live Activity per-order push token (ActivityKit)
    registerLiveActivityToken(orderId: ID!, token: String!): Boolean! @auth

    # Set the caller's language on all their in-progress (non-terminal) orders so
    # future status notifications + Live Activities use it; re-pushes active Live
    # Activities immediately. Called when the user switches language in-app.
    # Returns the number of orders updated.
    updateMyOrdersLanguage(language: String!): Int! @auth
}

extend type Subscription {
    orderCreated: Order! @staff

    # for the restaurant, fires on *every* order update
    orderUpdated: Order! @staff

    # for a customer, fires only when *their* order (by ID) changes
    myOrderUpdated(orderId: ID!): Order! @auth
}
