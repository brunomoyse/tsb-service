charged right now. Problems are reported instead of failing on the first one.
"""
input QuoteOrderInput {
  orderType: OrderTypeEnum!
  isOnlinePayment: Boolean!
  addressPlaceId: String
  preferredReadyTime: DateTime
  items: [QuoteOrderItemInput!]!
  """
  Only evaluated for an authenticated caller.
  """
  couponCode: String
}
input QuoteOrderItemInput {
  productId: ID!
  quantity: Int!
  choiceId: ID
  selections: [CreateOrderItemSelectionInput!]
  """
  The line total (decimal string) the client currently displays. When it differs from today's price the line gets a PRICE_CHANGED issue carrying currentPrice.
  """
  expectedLineTotal: String
}
type RestaurantConfig {
  orderingEnabled: Boolean!
  openingHours: JSON!
  orderingHours: JSON
  preparationMinutes: Int!
  isCurrentlyOpen: Boolean!
  isOrderingCurrentlyOpen: Boolean!
  availableSlotsToday: [TimeSlot!]!
  nextOpeningAt: DateTime
  policy: OrderingPolicy!
  updatedAt: DateTime!
}
type ScheduleOverride {
  date: DateTime!
  closed: Boolean!
  schedule: DaySchedule
  note: String
  updatedAt: DateTime!
}
input ScheduleOverrideInput {
  date: DateTime!
  closed: Boolean!
  schedule: DayScheduleInput
  note: String
}
type Subscription {
  assistantConnectionUpdated: AssistantConnection! @admin
  couponUpdated: Coupon! @admin
  orderCreated: Order! @staff
  orderUpdated: Order! @staff
  myOrderUpdated(orderId: ID!): Order! @auth
  productUpdated: Product!
  restaurantConfigUpdated: RestaurantConfig!
  scheduleOverridesUpdated: [ScheduleOverride!]!
}
scalar Time
